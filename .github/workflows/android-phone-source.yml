name: SwirPhone source checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: phone-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate Android source registry and staging
        run: python -m swirphoneos android-apps
      - name: Validate Android localization contracts
        run: python -m unittest discover -s tests -p 'test_android_i18n.py' -v
      - name: Validate Android app source regressions
        run: python -m unittest discover -s tests -p 'test_android_apps.py' -v
      - name: Validate SwirPhone in-call source contract
        run: python -m unittest discover -s tests -p 'test_phone_incall_source.py' -v
      - name: Host-test SwirPhone dial policy
        run: |
          mkdir -p _phone-java-test
          javac -d _phone-java-test platform/aosp_product/apps/SwirPhone/src/org/swir/phoneos/phone/DialerPolicy.java platform/aosp_product/apps/SwirPhone/hosttest/DialerPolicyHostTest.java
          java -cp _phone-java-test org.swir.phoneos.phone.DialerPolicyHostTest
