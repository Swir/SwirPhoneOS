name: SwirMessages source checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: messages-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate Android source registry and staging
        run: python -m swirphoneos android-apps
      - name: Validate Android localization contracts
        run: python -m unittest discover -s tests -p 'test_android_i18n.py' -v
      - name: Validate Android app source regressions
        run: python -m unittest discover -s tests -p 'test_android_apps.py' -v
      - name: Validate SwirMessages handoff-history safety boundary
        run: python -m unittest discover -s tests -p 'test_android_messages_handoff_history.py' -v
      - name: Host-test SwirMessages compose and local history policies
        run: |
          mkdir -p _messages-java-test
          javac -d _messages-java-test \
            platform/aosp_product/apps/SwirMessages/src/org/swir/phoneos/messages/MessagePolicy.java \
            platform/aosp_product/apps/SwirMessages/src/org/swir/phoneos/messages/MessageHandoffHistory.java \
            platform/aosp_product/apps/SwirMessages/hosttest/MessagePolicyHostTest.java \
            platform/aosp_product/apps/SwirMessages/hosttest/MessageHandoffHistoryHostTest.java
          java -cp _messages-java-test org.swir.phoneos.messages.MessagePolicyHostTest
          java -cp _messages-java-test org.swir.phoneos.messages.MessageHandoffHistoryHostTest
