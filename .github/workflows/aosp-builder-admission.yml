name: AOSP builder admission

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Parallel AOSP build jobs to validate against the host safety budget
        required: true
        default: '16'
        type: string
      require_kvm:
        description: Require readable and writable KVM so the builder is ready for Cuttlefish runtime evidence
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: swir-aosp-builder
  cancel-in-progress: false

jobs:
  admit-builder:
    name: Read-only AOSP builder admission
    runs-on: [self-hosted, linux, x64, swir-aosp-builder]
    timeout-minutes: 10
    env:
      SWIR_REQUESTED_JOBS: ${{ inputs.jobs }}
      SWIR_REQUIRE_KVM: ${{ inputs.require_kvm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Capture and validate read-only builder admission
        shell: bash
        run: |
          set -euo pipefail
          case "$SWIR_REQUESTED_JOBS" in
            ''|*[!0-9]*) printf 'Parallel job count must be an integer.\n' >&2; exit 1 ;;
          esac
          test "$SWIR_REQUESTED_JOBS" -ge 1
          test "$SWIR_REQUESTED_JOBS" -le 256
          case "$SWIR_REQUIRE_KVM" in
            true|false) ;;
            *) printf 'KVM requirement flag is invalid.\n' >&2; exit 1 ;;
          esac

          report="$GITHUB_WORKSPACE/builder-admission.json"
          if [[ -z "${SWIR_AOSP_WORKSPACE:-}" ]]; then
            printf '%s\n' '{"schema_version":1,"operation":"AOSP_BUILDER_ADMISSION","admitted":false,"reason":"SWIR_AOSP_WORKSPACE is not configured"}' > "$report"
            printf 'Set SWIR_AOSP_WORKSPACE on the dedicated self-hosted runner.\n' >&2
            exit 1
          fi
          if [[ "$SWIR_AOSP_WORKSPACE" != /* ]]; then
            printf '%s\n' '{"schema_version":1,"operation":"AOSP_BUILDER_ADMISSION","admitted":false,"reason":"SWIR_AOSP_WORKSPACE must be absolute"}' > "$report"
            printf 'SWIR_AOSP_WORKSPACE must be an absolute path.\n' >&2
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/tools"
          set +e
          python -m swirphoneos build-preflight --workspace "$SWIR_AOSP_WORKSPACE" > "$report"
          preflight_status=$?
          set -e

          python - "$report" "$SWIR_REQUIRE_KVM" "$preflight_status" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          require_kvm = sys.argv[2].lower() == "true"
          preflight_status = int(sys.argv[3])
          try:
              report = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"AOSP builder admission report is unreadable: {exc}")
          if report.get("operation") != "READ_ONLY_HOST_PREFLIGHT":
              raise SystemExit("AOSP builder admission did not receive the read-only preflight contract.")
          workspace = report.get("workspace")
          if not isinstance(workspace, dict) or workspace.get("cleanup_performed") is not False:
              raise SystemExit("AOSP builder admission cannot accept a preflight that mutated or omitted workspace state.")
          checks = report.get("checks")
          if not isinstance(checks, list) or not checks:
              raise SystemExit("AOSP builder preflight report has no checks.")
          failed = [
              str(item.get("id", "unknown"))
              for item in checks
              if not isinstance(item, dict) or item.get("passed") is not True
          ]
          if preflight_status != 0 or report.get("ready_for_full_build") is not True or failed:
              detail = ", ".join(failed) if failed else f"preflight_exit_{preflight_status}"
              raise SystemExit("AOSP builder admission rejected host: " + detail)
          if require_kvm and report.get("cuttlefish_kvm_available") is not True:
              raise SystemExit("AOSP builder admission requires readable/writable KVM for Cuttlefish runtime evidence.")
          PY
      - name: Capture exact admitted host and toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos.aosp_host_evidence \
            --workspace "$SWIR_AOSP_WORKSPACE" \
            --phase PRE_BUILD \
            > "$GITHUB_WORKSPACE/aosp-host-admission.json"
      - name: Bind successful admission to the exact run contract
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_WORKSPACE/builder-admission.json" \
            "$GITHUB_WORKSPACE/builder-admission-envelope.json" \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "$SWIR_REQUESTED_JOBS" "$SWIR_REQUIRE_KVM" <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          report_path = pathlib.Path(sys.argv[1])
          output_path = pathlib.Path(sys.argv[2])
          source_commit = sys.argv[3]
          repository = sys.argv[4]
          run_id_text = sys.argv[5]
          jobs_text = sys.argv[6]
          require_kvm_text = sys.argv[7].lower()

          raw = report_path.read_bytes()
          if not raw or len(raw) > 262144:
              raise SystemExit("Builder admission report must be non-empty and bounded to 256 KiB.")
          report = json.loads(raw.decode("utf-8"))
          if report.get("operation") != "READ_ONLY_HOST_PREFLIGHT" or report.get("ready_for_full_build") is not True:
              raise SystemExit("Cannot attest a failed or non-read-only builder preflight.")
          checks = report.get("checks")
          if not isinstance(checks, list) or not checks or any(
              not isinstance(item, dict) or item.get("passed") is not True for item in checks
          ):
              raise SystemExit("Cannot attest a builder preflight with missing or failed checks.")
          if re.fullmatch(r"[0-9a-f]{40}", source_commit) is None:
              raise SystemExit("Source commit is malformed.")
          if not repository or len(repository) > 200 or repository.count("/") != 1:
              raise SystemExit("Repository identity is malformed.")
          if not run_id_text.isdigit() or int(run_id_text) <= 0:
              raise SystemExit("Workflow run id is malformed.")
          if not jobs_text.isdigit() or not 1 <= int(jobs_text) <= 256:
              raise SystemExit("Requested job budget is malformed.")
          if require_kvm_text not in {"true", "false"}:
              raise SystemExit("KVM requirement is malformed.")
          require_kvm = require_kvm_text == "true"
          if require_kvm and report.get("cuttlefish_kvm_available") is not True:
              raise SystemExit("KVM was required but is not admitted by the preflight.")

          envelope = {
              "schema_version": 1,
              "operation": "AOSP_BUILDER_ADMISSION_ATTESTATION",
              "admitted": True,
              "read_only": True,
              "source_commit": source_commit,
              "repository": repository,
              "workflow_run_id": int(run_id_text),
              "requested_jobs": int(jobs_text),
              "require_kvm": require_kvm,
              "preflight_sha256": hashlib.sha256(raw).hexdigest(),
              "preflight_operation": report.get("operation"),
              "ready_for_full_build": True,
              "cuttlefish_kvm_available": report.get("cuttlefish_kvm_available") is True,
              "workspace_cleanup_performed": report.get("workspace", {}).get("cleanup_performed"),
          }
          output_path.write_text(
              json.dumps(envelope, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Re-verify bounded admission attestation before upload
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_WORKSPACE/builder-admission.json" \
            "$GITHUB_WORKSPACE/builder-admission-envelope.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          report_raw = pathlib.Path(sys.argv[1]).read_bytes()
          envelope_raw = pathlib.Path(sys.argv[2]).read_bytes()
          if not envelope_raw or len(envelope_raw) > 8192:
              raise SystemExit("Builder admission attestation must be non-empty and bounded to 8 KiB.")
          envelope = json.loads(envelope_raw.decode("utf-8"))
          expected_keys = {
              "schema_version", "operation", "admitted", "read_only", "source_commit",
              "repository", "workflow_run_id", "requested_jobs", "require_kvm",
              "preflight_sha256", "preflight_operation", "ready_for_full_build",
              "cuttlefish_kvm_available", "workspace_cleanup_performed",
          }
          if set(envelope) != expected_keys:
              raise SystemExit("Builder admission attestation field set is not exact.")
          if envelope.get("schema_version") != 1 or envelope.get("operation") != "AOSP_BUILDER_ADMISSION_ATTESTATION":
              raise SystemExit("Builder admission attestation schema is unexpected.")
          if envelope.get("admitted") is not True or envelope.get("read_only") is not True:
              raise SystemExit("Builder admission attestation is not an admitted read-only contract.")
          if envelope.get("ready_for_full_build") is not True or envelope.get("workspace_cleanup_performed") is not False:
              raise SystemExit("Builder admission attestation does not preserve the accepted preflight contract.")
          digest = envelope.get("preflight_sha256")
          if re.fullmatch(r"[0-9a-f]{64}", str(digest)) is None or digest != hashlib.sha256(report_raw).hexdigest():
              raise SystemExit("Builder admission attestation is not bound to the exact preflight bytes.")
          PY
      - name: Upload bounded builder admission report and attestation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SwirPhoneOS-aosp-builder-admission
          path: |
            builder-admission.json
            builder-admission-envelope.json
            aosp-host-admission.json
          if-no-files-found: error
          retention-days: 14
