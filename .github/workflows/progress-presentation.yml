name: Progress presentation checks

on:
  push:
    branches: [main]
    paths:
      - project.json
      - README.md
      - ROADMAP.md
      - BUILD_STATUS.md
      - assets/readme/progress-card.svg
      - assets/readme/progress-mini.svg
      - assets/readme/progress-template.svg
      - swirphoneos/progress_svg.py
      - swirphoneos/progress_presentation.py
      - swirphoneos/readiness.py
      - tests/test_progress_svg.py
      - tests/test_progress_presentation.py
      - .github/workflows/progress-presentation.yml
  pull_request:
    paths:
      - project.json
      - README.md
      - ROADMAP.md
      - BUILD_STATUS.md
      - assets/readme/progress-card.svg
      - assets/readme/progress-mini.svg
      - assets/readme/progress-template.svg
      - swirphoneos/progress_svg.py
      - swirphoneos/progress_presentation.py
      - swirphoneos/readiness.py
      - tests/test_progress_svg.py
      - tests/test_progress_presentation.py
      - .github/workflows/progress-presentation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: progress-presentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: SVG-only progress presentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'

      - name: Verify deterministic progress SVG bytes
        run: python -m swirphoneos.progress_svg --check

      - name: Verify SVG-only maintained presentation surfaces
        run: python -m swirphoneos.progress_presentation

      - name: Run focused progress regression suite
        run: python -m unittest -v tests.test_progress_svg tests.test_progress_presentation
