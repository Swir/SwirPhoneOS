name: Essential source suite
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: essential-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate complete Android source registry and staging
        run: python -m swirphoneos android-apps
      - name: Validate localization contracts
        run: python -m unittest discover -s tests -p 'test_android_i18n.py' -v
      - name: Validate Android source regressions
        run: python -m unittest discover -s tests -p 'test_android_apps*.py' -v
      - name: Validate essential registry
        run: python -m unittest discover -s tests -p 'test_system_apps.py' -v
      - name: Host-test new pure-Java policies
        shell: bash
        run: |
          set -euo pipefail
          for app in \
            'SwirCamera org/swir/phoneos/camera CameraPolicy CameraPolicyHostTest' \
            'SwirBrowser org/swir/phoneos/browser BrowserPolicy BrowserPolicyHostTest' \
            'SwirWeather org/swir/phoneos/weather WeatherPolicy WeatherPolicyHostTest' \
            'SwirBackup org/swir/phoneos/backup BackupPolicy BackupPolicyHostTest' \
            'SwirCalendar org/swir/phoneos/calendar EventPolicy EventPolicyHostTest' \
            'SwirGallery org/swir/phoneos/gallery MediaPolicy MediaPolicyHostTest'
          do
            set -- $app
            folder="$1"; package_path="$2"; policy="$3"; test="$4"
            out="_java-${folder}"
            mkdir -p "$out"
            javac -d "$out" \
              "platform/aosp_product/apps/${folder}/src/${package_path}/${policy}.java" \
              "platform/aosp_product/apps/${folder}/hosttest/${test}.java"
            package_name="${package_path//\//.}"
            java -cp "$out" "${package_name}.${test}"
          done
      - name: Host-test Swir Update trust and package policies
        shell: bash
        run: |
          set -euo pipefail
          out="_java-SwirUpdate"
          mkdir -p "$out"
          javac -d "$out" \
            platform/aosp_product/apps/SwirUpdate/src/org/swir/phoneos/update/UpdatePolicy.java \
            platform/aosp_product/apps/SwirUpdate/src/org/swir/phoneos/update/OtaTrustStore.java \
            platform/aosp_product/apps/SwirUpdate/src/org/swir/phoneos/update/DefaultOtaTrustStore.java \
            platform/aosp_product/apps/SwirUpdate/hosttest/UpdatePolicyHostTest.java \
            platform/aosp_product/apps/SwirUpdate/hosttest/OtaTrustStoreHostTest.java
          java -cp "$out" org.swir.phoneos.update.UpdatePolicyHostTest
          java -cp "$out" org.swir.phoneos.update.OtaTrustStoreHostTest
