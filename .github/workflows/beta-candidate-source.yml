name: Beta candidate source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beta-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Compile candidate verifier
        run: python -m compileall -q swirphoneos/beta_candidate.py swirphoneos/beta_candidate_cli.py tests/test_beta_candidate.py
      - name: Test candidate trust boundaries
        run: python -m unittest discover -s tests -p test_beta_candidate.py -v
      - name: Confirm project ledger remains blocked
        run: python -m swirphoneos gate || test $? -eq 2
      - name: Confirm deterministic SVG presentation
        run: python -m swirphoneos.progress_svg --check
