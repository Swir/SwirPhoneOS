name: Request admission-backed AOSP build

on:
  workflow_dispatch:
    inputs:
      admission_run_id:
        description: Successful AOSP builder admission workflow run ID for the exact current main commit
        required: true
        type: string
      collect_runtime:
        description: Collect Cuttlefish runtime evidence in the dispatched build; requires admitted KVM
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: swir-aosp-build-request
  cancel-in-progress: false

jobs:
  dispatch-build:
    name: Validate admission and dispatch exact AOSP build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SWIR_ADMISSION_RUN_ID: ${{ inputs.admission_run_id }}
      SWIR_COLLECT_RUNTIME: ${{ inputs.collect_runtime }}
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      GH_API_URL: ${{ github.api_url }}
      GH_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Fetch exact successful admission workflow metadata
        shell: bash
        run: |
          set -euo pipefail
          case "$SWIR_ADMISSION_RUN_ID" in
            ''|*[!0-9]*) printf 'Admission workflow run id must be a positive integer.\n' >&2; exit 1 ;;
          esac
          test "$SWIR_ADMISSION_RUN_ID" -ge 1
          test "$GH_API_URL" = "https://api.github.com"
          test "$GH_DEFAULT_BRANCH" = "main"
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$GH_TOKEN"
          python - <<'PY'
          import os
          import pathlib
          import urllib.error
          import urllib.request

          api_url = os.environ["GH_API_URL"]
          repository = os.environ["GH_REPOSITORY"]
          run_id = os.environ["SWIR_ADMISSION_RUN_ID"]
          token = os.environ["GH_TOKEN"]
          request = urllib.request.Request(
              f"{api_url}/repos/{repository}/actions/runs/{run_id}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2026-03-10",
                  "User-Agent": "SwirPhoneOS-aosp-build-request",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read(512 * 1024 + 1)
                  if int(response.status) != 200:
                      raise SystemExit(f"GitHub admission metadata returned HTTP {response.status}.")
          except urllib.error.HTTPError as exc:
              body = exc.read(4096).decode("utf-8", "replace")
              raise SystemExit(f"GitHub admission metadata failed with HTTP {exc.code}: {body}") from exc
          except urllib.error.URLError as exc:
              raise SystemExit(f"GitHub admission metadata request failed: {exc.reason}") from exc
          if not raw or len(raw) > 512 * 1024:
              raise SystemExit("GitHub admission metadata response is empty or oversized.")
          pathlib.Path("admission-run.json").write_bytes(raw)
          PY
      - name: Download exact builder admission artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SwirPhoneOS-aosp-builder-admission
          path: admission
          github-token: ${{ github.token }}
          run-id: ${{ inputs.admission_run_id }}
      - name: Validate exact admission and prepare build dispatch
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python -m swirphoneos.aosp_build_request \
            --admission-run "$GITHUB_WORKSPACE/admission-run.json" \
            --attestation "$GITHUB_WORKSPACE/admission/builder-admission-envelope.json" \
            --source-commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --admission-run-id "$SWIR_ADMISSION_RUN_ID" \
            --collect-runtime "$SWIR_COLLECT_RUNTIME" \
            --dispatch-output "$GITHUB_WORKSPACE/aosp-build-dispatch.json" \
            > "$GITHUB_WORKSPACE/aosp-build-request-report.json"
      - name: Dispatch exact admission-backed build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import urllib.error
          import urllib.request

          path = pathlib.Path("aosp-build-dispatch.json")
          payload = path.read_bytes()
          if not payload or len(payload) > 4096:
              raise SystemExit("AOSP build dispatch payload is empty or oversized.")
          request = urllib.request.Request(
              f"{os.environ['GH_API_URL']}/repos/{os.environ['GH_REPOSITORY']}/actions/workflows/aosp-build-evidence.yml/dispatches",
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2026-03-10",
                  "User-Agent": "SwirPhoneOS-aosp-build-request",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = int(response.status)
                  if status not in {200, 204}:
                      raise SystemExit(f"GitHub AOSP build dispatch returned unexpected HTTP {status}.")
          except urllib.error.HTTPError as exc:
              body = exc.read(4096).decode("utf-8", "replace")
              raise SystemExit(f"GitHub AOSP build dispatch failed with HTTP {exc.code}: {body}") from exc
          except urllib.error.URLError as exc:
              raise SystemExit(f"GitHub AOSP build dispatch failed: {exc.reason}") from exc
          pathlib.Path("aosp-build-dispatch-status.txt").write_text(
              f"dispatch_http_status={status}\n",
              encoding="utf-8",
          )
          PY
      - name: Upload bounded build-request evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SwirPhoneOS-aosp-build-request
          path: |
            aosp-build-request-report.json
            aosp-build-dispatch.json
            aosp-build-dispatch-status.txt
          if-no-files-found: warn
          retention-days: 14
