name: Host checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python sources
        run: python -m compileall -q swirphoneos tests
      - name: Host unit tests (no physical device)
        run: python -m unittest discover -s tests -v
      - name: Validate project ledger
        run: python -m swirphoneos status
      - name: Validate non-executable device registry
        run: python -m swirphoneos profiles
      - name: Validate pinned AOSP baseline metadata
        run: python -m swirphoneos baseline
      - name: Validate SwirPhoneOS Cuttlefish product contract
        run: python -m swirphoneos product-contract
      - name: Validate reproducible AOSP workspace plan
        run: python -m swirphoneos aosp-plan --workspace ./_aosp-contract --jobs 8
      - name: Validate first-party Android source bundle
        run: python -m swirphoneos android-apps
      - name: Host-test SwirCalculator pure Java engine
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: |
          mkdir -p _java-test
          javac -d _java-test platform/aosp_product/apps/SwirCalculator/src/org/swir/phoneos/calculator/CalculatorEngine.java platform/aosp_product/apps/SwirCalculator/hosttest/CalculatorEngineHostTest.java
          java -cp _java-test org.swir.phoneos.calculator.CalculatorEngineHostTest
      - name: Host-test SwirSettings route catalog
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: |
          mkdir -p _settings-java-test
          javac -d _settings-java-test platform/aosp_product/apps/SwirSettings/src/org/swir/phoneos/settings/SettingsCatalog.java platform/aosp_product/apps/SwirSettings/hosttest/SettingsCatalogHostTest.java
          java -cp _settings-java-test org.swir.phoneos.settings.SettingsCatalogHostTest
      - name: Host-test SwirFiles safety policy
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: |
          mkdir -p _files-java-test
          javac -d _files-java-test platform/aosp_product/apps/SwirFiles/src/org/swir/phoneos/files/FilePolicy.java platform/aosp_product/apps/SwirFiles/hosttest/FilePolicyHostTest.java
          java -cp _files-java-test org.swir.phoneos.files.FilePolicyHostTest
      - name: Host-test SwirDeviceCare health model
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: |
          mkdir -p _care-java-test
          javac -d _care-java-test platform/aosp_product/apps/SwirDeviceCare/src/org/swir/phoneos/device_care/HealthModel.java platform/aosp_product/apps/SwirDeviceCare/hosttest/HealthModelHostTest.java
          java -cp _care-java-test org.swir.phoneos.device_care.HealthModelHostTest
      - name: Host-test SwirUpdate verification policy
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: |
          mkdir -p _update-java-test
          javac -d _update-java-test platform/aosp_product/apps/SwirUpdate/src/org/swir/phoneos/update/UpdatePolicy.java platform/aosp_product/apps/SwirUpdate/hosttest/UpdatePolicyHostTest.java
          java -cp _update-java-test org.swir.phoneos.update.UpdatePolicyHostTest
      - name: Host-test SwirPrivacy route catalog
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: |
          mkdir -p _privacy-java-test
          javac -d _privacy-java-test platform/aosp_product/apps/SwirPrivacy/src/org/swir/phoneos/privacy/PrivacyCatalog.java platform/aosp_product/apps/SwirPrivacy/hosttest/PrivacyCatalogHostTest.java
          java -cp _privacy-java-test org.swir.phoneos.privacy.PrivacyCatalogHostTest
      - name: Host-test SwirClock time core
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: |
          mkdir -p _clock-java-test
          javac -d _clock-java-test platform/aosp_product/apps/SwirClock/src/org/swir/phoneos/clock/ClockCore.java platform/aosp_product/apps/SwirClock/hosttest/ClockCoreHostTest.java
          java -cp _clock-java-test org.swir.phoneos.clock.ClockCoreHostTest
      - name: Host-test SwirNotes note policy
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: |
          mkdir -p _notes-java-test
          javac -d _notes-java-test platform/aosp_product/apps/SwirNotes/src/org/swir/phoneos/notes/NotePolicy.java platform/aosp_product/apps/SwirNotes/hosttest/NotePolicyHostTest.java
          java -cp _notes-java-test org.swir.phoneos.notes.NotePolicyHostTest
      - name: Host-test SwirCalendar event policy
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: |
          mkdir -p _calendar-java-test
          javac -d _calendar-java-test platform/aosp_product/apps/SwirCalendar/src/org/swir/phoneos/calendar/EventPolicy.java platform/aosp_product/apps/SwirCalendar/hosttest/EventPolicyHostTest.java
          java -cp _calendar-java-test org.swir.phoneos.calendar.EventPolicyHostTest
      - name: Inspect AOSP host preflight contract
        run: python -m swirphoneos build-preflight --workspace .
      - name: Validate global localization catalogs
        run: python -m swirphoneos i18n
      - name: Validate essential system-app registry
        run: python -m swirphoneos apps
      - name: Validate fail-closed SwirRoot policy
        run: python -m swirphoneos root-policy
      - name: Linux native Tk runtime (synthetic data, virtual display)
        if: runner.os == 'Linux'
        env:
          SWIR_GUI_TESTS: '1'
        run: |
          xvfb-run -a python -m unittest discover -s tests -p test_studio_gui.py -v
          xvfb-run -a python -m swirphoneos.studio --smoke-test
      - name: Windows native Tk runtime (synthetic data)
        if: runner.os == 'Windows'
        env:
          SWIR_GUI_TESTS: '1'
        run: |
          python -m unittest discover -s tests -p test_studio_gui.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m swirphoneos.studio --smoke-test
