name: AOSP build evidence

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Parallel AOSP build jobs
        required: true
        default: '16'
        type: string
      collect_runtime:
        description: Launch the exact built Cuttlefish product and collect boot, app-launch, localization-review and exact-adb trust evidence
        required: true
        default: false
        type: boolean
      adb_path:
        description: Absolute canonical trusted adb path on the self-hosted builder when collect_runtime is enabled
        required: false
        default: /opt/android-sdk/platform-tools/adb
        type: string

permissions:
  contents: read

concurrency:
  group: swir-aosp-builder
  cancel-in-progress: false

jobs:
  build:
    name: Pinned Android 17 build evidence
    runs-on: [self-hosted, linux, x64, swir-aosp-builder]
    timeout-minutes: 720
    env:
      SWIR_REQUESTED_JOBS: ${{ inputs.jobs }}
      SWIR_COLLECT_RUNTIME: ${{ inputs.collect_runtime }}
      SWIR_ADB_PATH: ${{ inputs.adb_path }}
    steps:
      - name: Initialize bounded run diagnostics
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "BOOTSTRAP" > "$GITHUB_WORKSPACE/aosp-phase.txt"
          {
            printf 'source_commit=%s\n' "$GITHUB_SHA"
            printf 'requested_jobs=%s\n' "$SWIR_REQUESTED_JOBS"
            printf 'collect_runtime=%s\n' "$SWIR_COLLECT_RUNTIME"
          } > "$GITHUB_WORKSPACE/aosp-run-context.txt"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
      - name: Mark toolchain setup phase
        shell: bash
        run: printf '%s\n' "TOOLCHAIN" > "$GITHUB_WORKSPACE/aosp-phase.txt"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate builder configuration
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "PREFLIGHT" > "$GITHUB_WORKSPACE/aosp-phase.txt"
          : "${SWIR_AOSP_WORKSPACE:?Set SWIR_AOSP_WORKSPACE on the dedicated self-hosted runner}"
          case "$SWIR_REQUESTED_JOBS" in
            ''|*[!0-9]*) printf 'Parallel job count must be an integer.\n' >&2; exit 1 ;;
          esac
          test "$SWIR_REQUESTED_JOBS" -ge 1
          test "$SWIR_REQUESTED_JOBS" -le 256
          case "$SWIR_COLLECT_RUNTIME" in
            true|false) ;;
            *) printf 'Runtime collection flag is invalid.\n' >&2; exit 1 ;;
          esac
          cd tools
          python -m swirphoneos build-preflight --workspace "$SWIR_AOSP_WORKSPACE" > "$GITHUB_WORKSPACE/builder-preflight.json"
          if [[ "$SWIR_COLLECT_RUNTIME" == "true" ]]; then
            python -m swirphoneos.runtime_tool_evidence capture --adb "$SWIR_ADB_PATH" > "$GITHUB_WORKSPACE/runtime-tool-evidence.json"
          fi
          python - "$GITHUB_WORKSPACE/builder-preflight.json" "$SWIR_COLLECT_RUNTIME" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          report = json.loads(path.read_text(encoding="utf-8"))
          checks = report.get("checks", [])
          if not isinstance(checks, list) or not checks:
              raise SystemExit("AOSP builder preflight report has no checks.")
          failed = [
              item.get("id", "unknown")
              for item in checks
              if not isinstance(item, dict) or item.get("passed") is not True
          ]
          if report.get("ready_for_full_build") is not True:
              raise SystemExit("AOSP builder preflight rejected host; failed checks: " + ", ".join(failed))
          if failed:
              raise SystemExit("AOSP builder preflight is internally inconsistent; failed checks: " + ", ".join(failed))
          if sys.argv[2].lower() == "true" and report.get("cuttlefish_kvm_available") is not True:
              raise SystemExit("Runtime collection requires writable/readable KVM on the dedicated builder.")
          PY
          python -m swirphoneos aosp-plan --workspace "$SWIR_AOSP_WORKSPACE" --jobs "$SWIR_REQUESTED_JOBS" > "$GITHUB_WORKSPACE/aosp-plan.json"
      - name: Capture exact pre-build host and toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos.aosp_host_evidence \
            --workspace "$SWIR_AOSP_WORKSPACE" \
            --phase PRE_BUILD \
            > "$GITHUB_WORKSPACE/aosp-host-pre.json"
      - name: Initialize and synchronize exact Android 17 tag
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "SOURCE_SYNC" > "$GITHUB_WORKSPACE/aosp-phase.txt"
          cd "$SWIR_AOSP_WORKSPACE"
          repo init -u https://android.googlesource.com/platform/manifest -b android-17.0.0_r1
          repo sync -c --no-tags --optimized-fetch --prune -j"$SWIR_REQUESTED_JOBS"
          repo manifest -r -o swirphoneos-pinned-manifest.xml
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos aosp-manifest --file swirphoneos-pinned-manifest.xml > "$GITHUB_WORKSPACE/resolved-manifest.json"
      - name: Verify exact clean synchronized AOSP source
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos.aosp_source_evidence \
            --workspace "$SWIR_AOSP_WORKSPACE" \
            --manifest "$SWIR_AOSP_WORKSPACE/swirphoneos-pinned-manifest.xml" \
            > "$GITHUB_WORKSPACE/source-prebuild-evidence.json"
      - name: Stage reviewed SwirPhoneOS source
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "SOURCE_STAGE" > "$GITHUB_WORKSPACE/aosp-phase.txt"
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos stage-product --workspace "$SWIR_AOSP_WORKSPACE" --product-root "$GITHUB_WORKSPACE/tools/platform/aosp_product" --execute > "$GITHUB_WORKSPACE/stage-report.json"
          python - "$GITHUB_WORKSPACE/stage-report.json" <<'PY'
          import json
          import pathlib
          import re
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          digest = str(report.get("staged_content_sha256", ""))
          if report.get("schema_version") != 5:
              raise SystemExit("Unexpected stage evidence schema.")
          if report.get("executed") is not True or report.get("copy_verified") is not True:
              raise SystemExit("Staged source bytes were not fully copy-verified.")
          if report.get("destination_tree_closed") is not True:
              raise SystemExit("Staged vendor/swir tree is not closed to the reviewed manifest.")
          if re.fullmatch(r"[0-9a-f]{64}", digest) is None:
              raise SystemExit("Stage bundle digest is missing or malformed.")
          files = report.get("files")
          if not isinstance(files, list) or not files or any(not isinstance(item, dict) or item.get("copy_verified") is not True for item in files):
              raise SystemExit("One or more staged files lack copy verification.")
          if report.get("file_count") != len(files) or report.get("destination_file_count") != len(files):
              raise SystemExit("Staged vendor/swir file inventory is not exact.")
          preexisting = report.get("preexisting_destination_file_count")
          if not isinstance(preexisting, int) or isinstance(preexisting, bool) or not 0 <= preexisting <= len(files):
              raise SystemExit("Pre-existing vendor/swir file count is invalid.")
          PY
      - name: Build SwirPhoneOS Cuttlefish product
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "BUILD" > "$GITHUB_WORKSPACE/aosp-phase.txt"
          cd "$SWIR_AOSP_WORKSPACE"
          source build/envsetup.sh
          lunch swirphoneos_cf_x86_64-aosp_current-userdebug
          BUILD_LOG="$GITHUB_WORKSPACE/aosp-build-full.log"
          rm -f "$BUILD_LOG" "$GITHUB_WORKSPACE/aosp-build-tail.log"
          if ! m -j"$SWIR_REQUESTED_JOBS" 2>&1 | tee "$BUILD_LOG"; then
            tail -c 262144 "$BUILD_LOG" > "$GITHUB_WORKSPACE/aosp-build-tail.log" || true
            rm -f "$BUILD_LOG"
            exit 1
          fi
          rm -f "$BUILD_LOG" "$GITHUB_WORKSPACE/aosp-build-tail.log"
      - name: Re-verify exact staged source bytes after build
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "POST_BUILD_STAGE" > "$GITHUB_WORKSPACE/aosp-phase.txt"
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos.stage_evidence --report "$GITHUB_WORKSPACE/stage-report.json" --workspace "$SWIR_AOSP_WORKSPACE" > "$GITHUB_WORKSPACE/post-build-stage-evidence.json"
      - name: Re-verify exact clean AOSP source after build
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos.aosp_source_evidence \
            --workspace "$SWIR_AOSP_WORKSPACE" \
            --manifest "$SWIR_AOSP_WORKSPACE/swirphoneos-pinned-manifest.xml" \
            > "$GITHUB_WORKSPACE/source-postbuild-evidence.json"
      - name: Capture exact post-build host and toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos.aosp_host_evidence \
            --workspace "$SWIR_AOSP_WORKSPACE" \
            --phase POST_BUILD \
            > "$GITHUB_WORKSPACE/aosp-host-post.json"
      - name: Capture build provenance
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "BUILD_EVIDENCE" > "$GITHUB_WORKSPACE/aosp-phase.txt"
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos build-evidence --workspace "$SWIR_AOSP_WORKSPACE" --manifest "$SWIR_AOSP_WORKSPACE/swirphoneos-pinned-manifest.xml" --baseline "$GITHUB_WORKSPACE/tools/platform/aosp_baseline.json" > "$GITHUB_WORKSPACE/build-evidence.json"
      - name: Re-verify trusted adb before Cuttlefish runtime
        if: ${{ inputs.collect_runtime }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos.runtime_tool_evidence verify \
            --adb "$SWIR_ADB_PATH" \
            --evidence "$GITHUB_WORKSPACE/runtime-tool-evidence.json" \
            > "$GITHUB_WORKSPACE/runtime-tool-prelaunch-verification.json"
      - name: Launch exact built Cuttlefish product
        if: ${{ inputs.collect_runtime }}
        shell: bash
        env:
          SWIR_CVD_HOME: ${{ github.workspace }}/cuttlefish-home
        run: |
          set -euo pipefail
          printf '%s\n' "RUNTIME_LAUNCH" > "$GITHUB_WORKSPACE/aosp-phase.txt"
          rm -rf "$SWIR_CVD_HOME"
          mkdir -p "$SWIR_CVD_HOME"
          cd "$SWIR_AOSP_WORKSPACE"
          source build/envsetup.sh
          lunch swirphoneos_cf_x86_64-aosp_current-userdebug >/dev/null
          export HOME="$SWIR_CVD_HOME"
          LAUNCH_CVD="$(command -v launch_cvd || true)"
          test -n "$LAUNCH_CVD"
          test -x "$LAUNCH_CVD"
          "$LAUNCH_CVD" --daemon --report_anonymous_usage_stats=n
      - name: Wait for exact runtime identity and verified Android boot
        if: ${{ inputs.collect_runtime }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "RUNTIME_WAIT" > "$GITHUB_WORKSPACE/aosp-phase.txt"
          rm -f "$GITHUB_WORKSPACE/runtime-evidence.json" "$GITHUB_WORKSPACE/runtime-evidence.tmp"
          ready=0
          for attempt in $(seq 1 180); do
            if PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos cuttlefish-evidence --adb "$SWIR_ADB_PATH" --manifest "$GITHUB_WORKSPACE/tools/system_apps/manifest.json" > "$GITHUB_WORKSPACE/runtime-evidence.tmp" 2>/dev/null; then
              if python - "$GITHUB_WORKSPACE/runtime-evidence.tmp" <<'PY'
          import json
          import pathlib
          import sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          raise SystemExit(0 if report.get("runtime_evidence_complete") is True else 1)
          PY
              then
                mv "$GITHUB_WORKSPACE/runtime-evidence.tmp" "$GITHUB_WORKSPACE/runtime-evidence.json"
                ready=1
                break
              fi
            fi
            sleep 2
          done
          test "$ready" -eq 1
      - name: Exercise every source-ready app on exact local Cuttlefish
        if: ${{ inputs.collect_runtime }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "APP_SMOKE" > "$GITHUB_WORKSPACE/aosp-phase.txt"
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos.cuttlefish_smoke --adb "$SWIR_ADB_PATH" --manifest "$GITHUB_WORKSPACE/tools/system_apps/manifest.json" > "$GITHUB_WORKSPACE/app-smoke-evidence.json"
      - name: Exercise every source-ready app across the checked-in locale matrix
        if: ${{ inputs.collect_runtime }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "APP_I18N" > "$GITHUB_WORKSPACE/aosp-phase.txt"
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos.cuttlefish_i18n \
            --adb "$SWIR_ADB_PATH" \
            --manifest "$GITHUB_WORKSPACE/tools/system_apps/manifest.json" \
            > "$GITHUB_WORKSPACE/runtime-i18n-evidence.json"
      - name: Bind exact boot launch and localization runtime review
        if: ${{ inputs.collect_runtime }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "RUNTIME_REVIEW" > "$GITHUB_WORKSPACE/aosp-phase.txt"
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos.runtime_review_evidence \
            --runtime "$GITHUB_WORKSPACE/runtime-evidence.json" \
            --smoke "$GITHUB_WORKSPACE/app-smoke-evidence.json" \
            --i18n "$GITHUB_WORKSPACE/runtime-i18n-evidence.json" \
            --manifest "$GITHUB_WORKSPACE/tools/system_apps/manifest.json" \
            > "$GITHUB_WORKSPACE/runtime-review-evidence.json"
      - name: Re-verify trusted adb after complete runtime review
        if: ${{ inputs.collect_runtime }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos.runtime_tool_evidence verify \
            --adb "$SWIR_ADB_PATH" \
            --evidence "$GITHUB_WORKSPACE/runtime-tool-evidence.json" \
            > "$GITHUB_WORKSPACE/runtime-tool-post-verification.json"
      - name: Bind build and runtime evidence
        if: ${{ inputs.collect_runtime }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "RUNTIME_BIND" > "$GITHUB_WORKSPACE/aosp-phase.txt"
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos evidence-bundle --build "$GITHUB_WORKSPACE/build-evidence.json" --runtime "$GITHUB_WORKSPACE/runtime-evidence.json" > "$GITHUB_WORKSPACE/evidence-bundle.json"
      - name: Bind complete AOSP run evidence chain
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "RUN_BIND" > "$GITHUB_WORKSPACE/aosp-phase.txt"
          args=(
            --source-commit "$GITHUB_SHA"
            --preflight "$GITHUB_WORKSPACE/builder-preflight.json"
            --plan "$GITHUB_WORKSPACE/aosp-plan.json"
            --manifest "$GITHUB_WORKSPACE/resolved-manifest.json"
            --stage "$GITHUB_WORKSPACE/stage-report.json"
            --post-stage "$GITHUB_WORKSPACE/post-build-stage-evidence.json"
            --build "$GITHUB_WORKSPACE/build-evidence.json"
            --app-manifest "$GITHUB_WORKSPACE/tools/system_apps/manifest.json"
          )
          if [[ "$SWIR_COLLECT_RUNTIME" == "true" ]]; then
            args+=(
              --runtime "$GITHUB_WORKSPACE/runtime-evidence.json"
              --smoke "$GITHUB_WORKSPACE/app-smoke-evidence.json"
              --bundle "$GITHUB_WORKSPACE/evidence-bundle.json"
            )
          fi
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos aosp-run-evidence "${args[@]}" > "$GITHUB_WORKSPACE/aosp-run-evidence.json"
      - name: Bind exact clean source continuity to completed AOSP run
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos.aosp_source_trust_bundle \
            --run-evidence "$GITHUB_WORKSPACE/aosp-run-evidence.json" \
            --resolved-manifest-evidence "$GITHUB_WORKSPACE/resolved-manifest.json" \
            --source-pre "$GITHUB_WORKSPACE/source-prebuild-evidence.json" \
            --source-post "$GITHUB_WORKSPACE/source-postbuild-evidence.json" \
            > "$GITHUB_WORKSPACE/source-trust-bundle.json"
      - name: Bind exact host and toolchain continuity to completed AOSP run
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos.aosp_host_trust_bundle \
            --run-evidence "$GITHUB_WORKSPACE/aosp-run-evidence.json" \
            --host-pre "$GITHUB_WORKSPACE/aosp-host-pre.json" \
            --host-post "$GITHUB_WORKSPACE/aosp-host-post.json" \
            > "$GITHUB_WORKSPACE/aosp-host-trust-bundle.json"
      - name: Bind exact adb trust to completed runtime evidence
        if: ${{ inputs.collect_runtime }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "TRUST_BIND" > "$GITHUB_WORKSPACE/aosp-phase.txt"
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos.runtime_trust_bundle \
            --run-evidence "$GITHUB_WORKSPACE/aosp-run-evidence.json" \
            --tool-evidence "$GITHUB_WORKSPACE/runtime-tool-evidence.json" \
            --prelaunch "$GITHUB_WORKSPACE/runtime-tool-prelaunch-verification.json" \
            --post "$GITHUB_WORKSPACE/runtime-tool-post-verification.json" \
            > "$GITHUB_WORKSPACE/runtime-trust-bundle.json"
      - name: Bind trusted runtime localization review evidence
        if: ${{ inputs.collect_runtime }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "TRUST_BIND" > "$GITHUB_WORKSPACE/aosp-phase.txt"
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos.runtime_review_trust_bundle \
            --run-evidence "$GITHUB_WORKSPACE/aosp-run-evidence.json" \
            --runtime-trust "$GITHUB_WORKSPACE/runtime-trust-bundle.json" \
            --runtime-review "$GITHUB_WORKSPACE/runtime-review-evidence.json" \
            > "$GITHUB_WORKSPACE/runtime-review-trust-bundle.json"
      - name: Stop local Cuttlefish instance
        if: ${{ always() && inputs.collect_runtime }}
        shell: bash
        env:
          SWIR_CVD_HOME: ${{ github.workspace }}/cuttlefish-home
        run: |
          set +e
          cd "$SWIR_AOSP_WORKSPACE"
          source build/envsetup.sh
          lunch swirphoneos_cf_x86_64-aosp_current-userdebug >/dev/null 2>&1
          export HOME="$SWIR_CVD_HOME"
          STOP_CVD="$(command -v stop_cvd || true)"
          if test -n "$STOP_CVD" && test -x "$STOP_CVD"; then
            "$STOP_CVD"
          fi
          exit 0
      - name: Collect bounded failure evidence
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          if test -f "$GITHUB_WORKSPACE/aosp-build-full.log"; then
            tail -c 262144 "$GITHUB_WORKSPACE/aosp-build-full.log" > "$GITHUB_WORKSPACE/aosp-build-tail.log" || true
            rm -f "$GITHUB_WORKSPACE/aosp-build-full.log"
          fi
          phase="BOOTSTRAP"
          if test -f "$GITHUB_WORKSPACE/aosp-phase.txt"; then
            phase="$(head -n 1 "$GITHUB_WORKSPACE/aosp-phase.txt" | tr -d '\r\n')"
          fi
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m swirphoneos.aosp_failure_cli \
            --source-commit "$GITHUB_SHA" \
            --phase "$phase" \
            --baseline "$GITHUB_WORKSPACE/tools/platform/aosp_baseline.json" \
            --run-context "$GITHUB_WORKSPACE/aosp-run-context.txt" \
            --preflight "$GITHUB_WORKSPACE/builder-preflight.json" \
            --plan "$GITHUB_WORKSPACE/aosp-plan.json" \
            --manifest "$GITHUB_WORKSPACE/resolved-manifest.json" \
            --stage "$GITHUB_WORKSPACE/stage-report.json" \
            --post-stage "$GITHUB_WORKSPACE/post-build-stage-evidence.json" \
            --build "$GITHUB_WORKSPACE/build-evidence.json" \
            --runtime "$GITHUB_WORKSPACE/runtime-evidence.json" \
            --smoke "$GITHUB_WORKSPACE/app-smoke-evidence.json" \
            --i18n "$GITHUB_WORKSPACE/runtime-i18n-evidence.json" \
            --runtime-review "$GITHUB_WORKSPACE/runtime-review-evidence.json" \
            --bundle "$GITHUB_WORKSPACE/evidence-bundle.json" \
            --run-evidence "$GITHUB_WORKSPACE/aosp-run-evidence.json" \
            --runtime-trust "$GITHUB_WORKSPACE/runtime-trust-bundle.json" \
            --runtime-review-trust "$GITHUB_WORKSPACE/runtime-review-trust-bundle.json" \
            --diagnostic-log "$GITHUB_WORKSPACE/aosp-build-tail.log" \
            > "$GITHUB_WORKSPACE/aosp-failure-evidence.json"
          status=$?
          if test "$status" -ne 0; then
            rm -f "$GITHUB_WORKSPACE/aosp-failure-evidence.json"
            printf 'Failure evidence generator exited with status %s; inspect immutable run context and GitHub step logs.\n' "$status" > "$GITHUB_WORKSPACE/aosp-failure-evidence-error.txt"
          fi
          exit 0
      - name: Upload immutable evidence files
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swirphoneos-aosp-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            aosp-run-context.txt
            aosp-phase.txt
            builder-preflight.json
            aosp-host-pre.json
            aosp-host-post.json
            aosp-host-trust-bundle.json
            runtime-tool-evidence.json
            runtime-tool-prelaunch-verification.json
            runtime-tool-post-verification.json
            runtime-trust-bundle.json
            runtime-i18n-evidence.json
            runtime-review-evidence.json
            runtime-review-trust-bundle.json
            aosp-plan.json
            resolved-manifest.json
            source-prebuild-evidence.json
            source-postbuild-evidence.json
            source-trust-bundle.json
            stage-report.json
            post-build-stage-evidence.json
            build-evidence.json
            runtime-evidence.json
            app-smoke-evidence.json
            evidence-bundle.json
            aosp-run-evidence.json
            aosp-build-tail.log
            aosp-failure-evidence.json
            aosp-failure-evidence-error.txt
