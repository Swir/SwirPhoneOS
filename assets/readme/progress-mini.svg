<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="72" viewBox="0 0 900 72" role="img" aria-labelledby="title desc">
  <title id="title">SwirPhoneOS roadmap progress: 2%</title>
  <desc id="desc">Weighted engineering progress 2%; milestones 1 of 10; beta gates 0 of 9.</desc>
  <defs>
    <linearGradient id="swir-progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0088FF"/>
      <stop offset="1" stop-color="#62E5FF"/>
    </linearGradient>
    <pattern id="swir-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#143044" stroke-width="1" opacity="0.22"/>
    </pattern>
    <filter id="swir-glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <defs>
    <clipPath id="mini-track-clip"><rect x="170" y="28" width="700" height="14" rx="7"/></clipPath>
  </defs>
  <rect x="1" y="1" width="898" height="70" rx="16" fill="#02050A" stroke="#17364A" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="68" rx="15" fill="url(#swir-grid)" opacity="0.45"/>
  <text x="20" y="27" fill="#62E5FF" font-size="15" font-family="Segoe UI, Arial, sans-serif" font-weight="700">SwirPhoneOS</text>
  <text x="20" y="50" fill="#8DA8B8" font-size="12" font-family="Segoe UI, Arial, sans-serif">Milestones: 1/10</text>
  <rect id="progress-track" x="170" y="28" width="700" height="14" rx="7" fill="#07111C" stroke="#1D4258"/>
  <rect id="progress-fill" x="170" y="28" width="14" height="14" rx="7" fill="url(#swir-progress)" filter="url(#swir-glow)" clip-path="url(#mini-track-clip)"/>
  <text x="870" y="19" text-anchor="end" fill="#F4FAFF" font-size="15" font-family="Segoe UI, Arial, sans-serif" font-weight="700">2%</text>
  <text x="870" y="61" text-anchor="end" fill="#8DA8B8" font-size="12" font-family="Segoe UI, Arial, sans-serif">IN PROGRESS • Beta 0/9</text>
</svg>
